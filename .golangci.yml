# .golangci.yml — golangci-lint v2 (format v2, KHÔNG tương thích v1)
# Verify: golangci-lint config verify
# Docs:   https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  # Đường dẫn trong báo cáo tính từ thư mục làm việc (mặc định "cfg" = từ thư mục chứa config,
  # in ra ../../.. khi dùng config mặc định global của kit)
  relative-path-mode: wd
  modules-download-mode: readonly
  tests: true
  # build-tags: [integration]

output:
  sort-order: [file, linter, severity]
  show-stats: true

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # --- bug / correctness ---
    - bodyclose        # quên Close() resp.Body
    - copyloopvar      # Go >= 1.22: capture loop var không cần copy nữa
    - durationcheck
    - errorlint        # dùng errors.Is/As thay vì == / type assert
    - exhaustive       # switch enum thiếu case
    - makezero
    - nilerr
    - nilnesserr
    - noctx            # http request / sql không truyền context
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unparam
    # --- security ---
    - gosec
    # --- style / maintainability (vừa phải, không quá khắt khe) ---
    - gocritic
    - misspell
    - prealloc
    - revive
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment   # ồn, chỉ bật khi tối ưu memory
        - shadow           # bật nếu team đồng ý
    gosec:
      excludes:
        - G104  # trùng errcheck
      config:
        G301: "0750"
        G302: "0640"
        G306: "0640"
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
        - name: unused-parameter
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: increment-decrement
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        - hugeParam        # nhiều false positive với struct lớn truyền by value có chủ ý
    misspell:
      locale: US
    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # test được phép lỏng hơn
      - path: _test\.go
        linters: [gosec, errcheck, noctx, unparam]
      # main.go / cmd: cho phép os.Exit, log.Fatal
      - path: (^|/)cmd/.*\.go$|(^|/)main\.go$
        linters: [gocritic]
        text: exitAfterDefer

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    # Per-repo: thêm module path của tổ chức để nhóm import nội bộ riêng, ví dụ:
    # goimports:
    #   local-prefixes: [github.com/your-org]
    # (bản mặc định global không đặt vì không biết module path của repo)
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Khi chạy pre-commit: --new-from-rev=HEAD (xem .pre-commit-config.yaml)
  # Khi chạy CI: full
